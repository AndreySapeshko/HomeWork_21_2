<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store</title>
    <link href="css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .sidebar {
            min-height: 100vh;
        }

        .container-fluid {
            padding-left: 0;
            padding-right: 0;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 bg-dark text-white sidebar p-0">
            <div class="mt-4 bg-dark p-3">
                <h5 class="mb-0 ms-4">Меню</h5>
            </div>
            <nav class="nav flex-column p-3">
                <a class="nav-link text-white" href="#">
                    <i class="bi bi-house me-2"></i>Главная
                </a>
                <a class="nav-link text-white" href="#">
                    <i class="bi bi-person me-2"></i>Категории
                </a>
                <a class="nav-link text-white" href="#">
                    <i class="bi bi-gear me-2"></i>Заказы
                </a>
                <a class="nav-link text-white" href="#">
                    <i class="bi bi-envelope me-2"></i>Контакты
                </a>
            </nav>
            <div class="dropdown w-25">
                <button class="btn bg-dark text-white dropdown-toggle mb-1" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false" style="position: fixed; bottom: 20px; left: 20px;">
                    Пользователь
                </button>
                <ul class="dropdown-menu bg-dark">
                    <li><a class="dropdown-item text-white" href="#">Профиль</a></li>
                    <li><a class="dropdown-item text-white" href="#">Выход</a></li>
                </ul>
            </div>
        </div>

        <div class="col-md-9 col-lg-10 bg-light">
            <div class="p-4">
                <h1>Основной контент</h1>
                <p>Здесь размещается основной контент вашей страницы.</p>
            </div>
        </div>
    </div>
</div>

<script src="js/bootstrap.min.js"></script>
</body>
</html>
